<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>姓名婚姻與流年分析 - 甄好運姓名學專用</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        html { -webkit-text-size-adjust: none; text-size-adjust: none; }
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f8f9fa; text-align: center; color: #333; margin: 0; padding: 0; }
        
        .main-container { padding: 20px 15px; }
        .input-box { background: white; border: 1px solid #ddd; border-radius: 15px; padding: 20px; max-width: 450px; margin: 0 auto 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .name-group { margin-bottom: 15px; padding: 10px; border: 1px solid #eee; border-radius: 10px; }
        .name-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #800000; }
        input { width: 35%; padding: 12px; margin: 5px; text-align: center; font-size: 18px; border: 1px solid #ccc; border-radius: 8px; }
        .short-input { width: 30%; } 
        button { width: 85%; padding: 14px; background-color: #800000; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; font-weight: bold; transition: 0.3s; margin-top: 10px; }
        button:disabled { background-color: #bbb; cursor: not-allowed; }
        
        #captureArea { background-color: #ffffff; padding: 20px; border-radius: 10px; margin: 0 auto; max-width: 500px; box-sizing: border-box; }
        
        .result-container { display: flex; flex-wrap: nowrap; justify-content: center; gap: 10px; width: 100%; }
        .result-frame { border: 2px solid maroon; border-radius: 15px; padding: 15px 5px; width: 100%; max-width: 320px; background-color: #FFFBFA; box-shadow: 0 10px 25px rgba(0,0,0,0.05); display: none; box-sizing: border-box; margin: 0 auto; }
        .result-title { font-weight: bold; font-size: 18px; color: #800000; margin-bottom: 5px; }
        table { margin: 0 auto; border-collapse: collapse; width: 100%; table-layout: fixed; }
        .char-row { height: 60px; }
        .arrow-row { height: 45px; vertical-align: middle; }
        .arrow-row td { height: 45px; padding: 0; }
        
        .stroke-text { font-size: 13px; color: #aaa; width: 55px; text-align: right; padding-right: 12px; box-sizing: border-box; }
        .char-text { font-size: 18px; font-weight: bold; width: 45px; color: black; text-align: left; padding-left: 5px; box-sizing: border-box; }
        .num-text { font-size: 17px; color: #483D8B; width: 35px; text-align: center; }
        .wx-text { font-size: 15px; color: #483D8B; width: 30px; text-align: center; }
        .ge-label { font-size: 13px; color: #483D8B; font-weight: bold; width: 70px; text-align: left; } 
        .qi-text { color: #d32f2f; font-weight: bold; margin-left: 5px; } 
        
        .total-box { font-size: 18px; color: darkred; font-weight: bold; margin-top: 15px; border-top: 1.5px solid #ddd; padding-top: 15px; }
        
        .fortune-display { margin: 10px 0 15px 0; padding: 5px; width: 100%; box-sizing: border-box; }
        .age-line-container { display: flex; align-items: center; justify-content: center; gap: 5px; margin-bottom: 5px; width: 100%; flex-wrap: nowrap; }
        .date-text { font-size: 12px; color: #666; font-weight: bold; flex: 0 0 auto; white-space: nowrap; }
        .line-wrapper { flex: 1 1 auto; position: relative; height: 35px; display: flex; align-items: flex-end; border-bottom: 2px solid #800000; margin-bottom: 10px; min-width: 40px; }
        .age-text { position: absolute; width: 100%; text-align: center; bottom: 5px; font-size: 20px; font-weight: bold; color: red; white-space: nowrap; }

        .analysis-box { width: 100%; text-align: left; background: #fff; border: 1px solid #800000; border-radius: 10px; padding: 18px; margin-top: 20px; box-sizing: border-box; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: none; }
        .analysis-box h3 { color: #800000; margin-top: 0; font-size: 18px; border-bottom: 2px solid #800000; padding-bottom: 8px; margin-bottom: 15px; }
        .analysis-text { font-size: 15.5px; line-height: 1.6; color: #333; font-weight: bold; }
        
        .warning-box { background-color: #FFF4F4; border: 1px solid #FFD3D3; border-left: 5px solid #E57373; border-radius: 6px; padding: 15px; margin-bottom: 15px; color: #5D4037; font-size: 15px; line-height: 1.5; font-weight: bold; }
        .warning-title { font-size: 17px; color: #D32F2F; margin-bottom: 8px; display: flex; align-items: center; }
        
        #downloadContainer { display: none; margin-top: 20px; padding-bottom: 30px; }
        .btn-download { width: 100%; max-width: 450px; margin: 0 auto; padding: 14px; background-color: #2E8B57; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; font-weight: bold; transition: 0.3s; box-shadow: 0 4px 10px rgba(46, 139, 87, 0.3); display: block; }
        .btn-download:hover { background-color: #246B43; }
        
        #status { font-size: 13px; color: #888; margin-bottom: 10px; }

        /* ================= MBTI 專區樣式 ================= */
        .mbti-container { display: flex; flex-direction: column; gap: 15px; width: 100%; margin-top: 20px; }
        .mbti-card { background-color: #fdf2f8; border-radius: 12px; padding: 15px; border: 1px solid #f4e8f7; }
        .mbti-top { display: flex; align-items: center; justify-content: space-between; }
        .mbti-side { display: flex; flex-direction: column; align-items: center; width: 90px; }
        .mbti-label { font-size: 13px; font-weight: bold; color: #334155; }
        .mbti-letter { font-size: 32px; font-family: "Georgia", serif; font-weight: bold; color: #583385; line-height: 1.1; }
        .mbti-desc { font-size: 11px; color: #705898; text-align: center; margin-top: 4px; line-height: 1.3; }
        .mbti-center { text-align: center; flex: 1; padding: 0 5px; }
        .mbti-axis { font-size: 14px; font-weight: bold; color: #583385; margin-bottom: 4px; }
        .mbti-axis-desc { font-size: 11px; color: #64748b; line-height: 1.3; }
        .mbti-prog-sec { margin-top: 12px; padding-top: 10px; border-top: 1px dashed #e9d5ff; }
        .mbti-percents { display: flex; justify-content: space-between; font-size: 12px; font-weight: bold; color: #583385; margin-bottom: 5px; }
        .mbti-bar-bg { width: 100%; height: 8px; background-color: #e2d9f3; border-radius: 20px; overflow: hidden; }
        .mbti-bar-fill { height: 100%; background: linear-gradient(90deg, #a855f7, #6366f1); border-radius: 20px; }
    </style>
</head>
<body>
    <div class="main-container">
        <h2 style="margin-top: 0; margin-bottom: 5px; line-height: 1.2;">姓名婚姻與流年分析</h2>
        <div style="font-size: 18px; color: #666; margin-bottom: 15px; font-weight: normal;">甄好運姓名學專用</div>
        <div id="status">正在同步字典數據...</div>

        <div class="input-box">
            <div class="name-group">
                <label>1. 輸入鑑定姓名</label>
                <input type="text" id="lName" placeholder="姓" maxlength="2">
                <input type="text" id="fName" placeholder="名" maxlength="4">
            </div>
            
            <div class="name-group">
                <label>2. 流年參數設定</label>
                <input type="number" id="yearCurrent" placeholder="計算民國年 (如 115)" style="width: 80%;">
                <div style="margin-top: 10px;">
                    <span style="font-weight: bold; color: #666; font-size: 14px;">出生：民國 </span>
                    <input type="number" id="birthYear" class="short-input" placeholder="年">
                    <span style="font-weight: bold; color: #666; font-size: 14px;"> 年 </span>
                    <input type="number" id="birthMonth" class="short-input" placeholder="月">
                    <span style="font-weight: bold; color: #666; font-size: 14px;"> 月 </span>
                </div>
            </div>
            
            <button id="btnRun" onclick="analyzeName()" disabled>開始分析</button>
        </div>

        <div id="captureArea">
            <div id="pdfTitle" style="display:none; text-align:center; margin-bottom:25px; padding-top:10px;">
                <h2 style="margin: 0; color: #800000; line-height: 1.2; font-size: 26px;">姓名婚姻與流年分析</h2>
                <div style="font-size: 16px; color: #666; font-weight: normal; margin-top: 5px;">甄好運姓名學專屬報告</div>
            </div>

            <div class="result-container">
                <div id="mResultFrame" class="result-frame">
                    <div class="result-title">命盤格局</div>
                    <div id="fortuneDisplay" class="fortune-display"></div>
                    <table id="mResultTable"></table>
                    <div id="mTotalBox" class="total-box"></div>
                </div>
            </div>
            
            <div id="analysisBox" class="analysis-box">
                <h3>婚姻宮分析結果</h3>
                <div id="analysisContent"></div>
            </div>
        </div>
        
        <div id="downloadContainer">
            <button id="btnDownload" class="btn-download" onclick="downloadPDF()">📥 下載分析結果 (PDF)</button>
        </div>
    </div>

    <script>
        let dictionary = {};
        const btn = document.getElementById('btnRun');
        const status = document.getElementById('status');

        function getStrokes(char) {
            const customStrokes = {
                '互': 4, '片': 4, '氏': 4, '及': 4, '之': 4, '王': 4, '瓦': 5, '台': 5, '巡': 6, '卉': 6,
                '廷': 7, '初': 7, '秀': 7, '成': 7, '亞': 8, '武': 8, '昆': 8, '沛': 8, '牧': 8, '弢': 8, '去': 8, '幺': 8,
                '政': 9, '盈': 9, '建': 9, '妍': 9, '致': 9, '修': 9, '哲': 10, '卿': 10, '娜': 10, '育': 10,
                '屏': 11, '胡': 11, '強': 11, '迎': 11, '閏': 11, '一': 11, '弓': 11, '丿': 11,
                '傑': 12, '黃': 12, '盛': 12, '勝': 12, '為': 12, '能': 12, '胸': 12, '涵': 12,
                '溫': 13, '新': 13, '敬': 13, '雋': 13, '淵': 13, '郎': 14, '鳳': 14, '萍': 14, '慈': 14, '嘉': 14,
                '萬': 15, '興': 15, '霈': 15, '數': 15, '寬': 15, '豎': 15, '履': 15, '學': 16, '樺': 16, '璇': 16, '閣': 16, '潔': 16, '頤': 16,
                '鴻': 17, '臨': 17, '燦': 17, '戴': 18, '豐': 18, '珞': 18, '魏': 18, '蕭': 19, '覺': 19, '贊': 19, '羅': 20, '寶': 20, '藏': 20, '譽': 20, '馨': 20,
                '屬': 21, '龔': 22, '響': 22, '霽': 22, '蘭': 23, '麟': 23, '艷': 24
            };
            return customStrokes[char] || dictionary[char] || 0;
        }

        async function loadDict() {
            try {
                const files = ['slim_a.txt', 'slim_b.txt'];
                for (const file of files) {
                    const response = await fetch(file);
                    const data = await response.json();
                    for (let key in data) { dictionary[key] = data[key]; }
                }
                status.innerText = "✅ 字典已就緒";
                btn.disabled = false;
            } catch (err) { status.innerHTML = "❌ 字典載入異常"; }
        }
        loadDict();

        function reduceToSingleDigit(n) {
            while (n >= 10) { n = String(n).split('').reduce((sum, d) => sum + parseInt(d), 0); }
            return n;
        }

        function getWX(n) {
            const map = {1:"木", 2:"木", 3:"火", 4:"火", 5:"土", 6:"土", 7:"金", 8:"金", 9:"水", 0:"水"};
            return map[n % 10];
        }

        function getRelationInfo(up, down) {
            const getIdx = (n) => {
                const t = n % 10;
                if (t==1||t==2) return 0; if (t==3||t==4) return 1;
                if (t==5||t==6) return 2; if (t==7||t==8) return 3; return 4;
            };
            const u = getIdx(up), d = getIdx(down);
            if (u == d) return { type: "無", dir: "" };
            if ((u + 1) % 5 == d) return { type: "生", dir: "下" };
            if ((d + 1) % 5 == u) return { type: "生", dir: "上" };
            const ke = [0, 2, 4, 1, 3];
            const ui = ke.indexOf(u), di = ke.indexOf(d);
            if ((ui + 1) % 5 == di) return { type: "剋", dir: "下" };
            if ((di + 1) % 5 == ui) return { type: "剋", dir: "上" };
            return { type: "無", dir: "" };
        }

        function createArrowSvg(info) {
            if (info.type === "無") return `<svg width="30" height="35" style="display:block; margin:0 auto; visibility:hidden;"></svg>`;
            const head = info.type === "生" ? 
                (info.dir === "下" ? "M -4,-6 L 0,0 L 4,-6" : "M -4,6 L 0,0 L 4,6") :
                (info.dir === "下" ? "M -5,-8 L 5,-8 L 0,2 Z" : "M -5,8 L 5,8 L 0,-2 Z");
            const y = info.dir === "下" ? 30 : 5;
            return `<svg width="30" height="35" style="display:block; margin:0 auto;">
                <line x1="15" y1="5" x2="15" y2="30" stroke="red" stroke-width="1.2" />
                <path d="${head}" fill="${info.type === '生' ? 'none' : 'red'}" stroke="red" stroke-width="1.2" transform="translate(15,${y})" />
            </svg>`;
        }
        
        function createMiniArrowSvg(info) {
            if (info.type === "無") return `<svg width="20" height="20" style="display:block; margin:2px auto; visibility:hidden;"></svg>`;
            const head = info.type === "生" ? 
                (info.dir === "下" ? "M -3,-4 L 0,0 L 3,-4" : "M -3,4 L 0,0 L 3,4") :
                (info.dir === "下" ? "M -4,-5 L 4,-5 L 0,2 Z" : "M -4,5 L 4,5 L 0,-2 Z");
            const y = info.dir === "下" ? 18 : 2;
            return `<svg width="20" height="20" style="display:block; margin:2px auto;">
                <line x1="10" y1="2" x2="10" y2="18" stroke="red" stroke-width="1.2" />
                <path d="${head}" fill="${info.type === '生' ? 'none' : 'red'}" stroke="red" stroke-width="1.2" transform="translate(10,${y})" />
            </svg>`;
        }

        function getGirdData(lStr, fStr) {
            let lNameArr = [], fNameArr = [], lStrokes = [], fStrokes = [];
            
            if (/^\d{1,2}$/.test(lStr)) {
                lNameArr = [lStr];
                lStrokes = [parseInt(lStr)];
            } else {
                lNameArr = lStr.split('');
                lStrokes = lNameArr.map(c => getStrokes(c));
            }

            if (/^\d{4}$/.test(fStr)) {
                let n1 = parseInt(fStr.substring(0, 2));
                let n2 = parseInt(fStr.substring(2, 4));
                fNameArr = [fStr.substring(0, 2)];
                fStrokes = [n1];
                if (n2 !== 0) {
                    fNameArr.push(fStr.substring(2, 4));
                    fStrokes.push(n2);
                }
            } else {
                fNameArr = fStr.split('');
                fStrokes = fNameArr.map(c => getStrokes(c));
            }

            const lTotal = lStrokes.reduce((a, b) => a + b, 0);
            const tian = lStrokes.length === 1 ? lStrokes[0] + 1 : lTotal;
            const ren = lTotal + fStrokes[0];
            const di = fStrokes.length === 1 ? fStrokes[0] + 1 : fStrokes[0] + fStrokes[1];
            const zong = lTotal + fStrokes.reduce((a, b) => a + b, 0);

            return { lNameArr, fNameArr, lStrokes, fStrokes, tian, ren, di, zong };
        }

        function getQi(strokeVal, yearVal) {
            const qiList = ["名", "財", "官", "利", "交", "敗", "衰", "煞", "絕"];
            const sDig = strokeVal % 9 || 9;
            const yDig = yearVal % 9 || 9;
            let diff = (yDig - sDig) % 9;
            if (diff < 0) diff += 9;
            return qiList[diff];
        }

        function buildTableHtml(data, renWx, diWx, marriageRel, YY) {
            let html = "";
            const tianQi = getQi(data.tian, YY);
            const renQi = getQi(data.ren, YY);
            const diQi = getQi(data.di, YY);
            const qianYi = data.fStrokes.length > 1 ? data.fStrokes[1] + 1 : 1;
            
            const palaceHtml = `
                <div style="position:absolute; right:35px; top:50%; transform:translateY(-50%); font-size:15px; font-weight:bold; color:#800000; line-height:1; text-align:center;">
                    <div>${renWx}</div>
                    ${createMiniArrowSvg(marriageRel)}
                    <div>${diWx}</div>
                </div>`;

            if (data.lStrokes.length === 1) {
                html += `<tr class="char-row"><td class="stroke-text">${data.lStrokes[0]}</td><td class="char-text">${data.lNameArr[0]}</td><td class="num-text">${data.tian}</td><td class="wx-text">${getWX(data.tian)}</td><td class="ge-label">天格 <span class="qi-text">${tianQi}</span></td></tr>`;
            } else {
                html += `<tr class="char-row"><td class="stroke-text">${data.lStrokes[0]}</td><td class="char-text">${data.lNameArr[0]}</td><td></td><td></td><td></td></tr>`;
                html += `<tr class="char-row"><td class="stroke-text">${data.lStrokes[1]}</td><td class="char-text">${data.lNameArr[1]}</td><td class="num-text">${data.tian}</td><td class="wx-text">${getWX(data.tian)}</td><td class="ge-label">天格 <span class="qi-text">${tianQi}</span></td></tr>`;
            }
            
            html += `<tr class="arrow-row"><td></td><td></td><td></td><td>${createArrowSvg(getRelationInfo(data.tian, data.ren))}</td><td></td></tr>`;
            html += `<tr class="char-row"><td class="stroke-text">${data.fStrokes[0]}</td><td class="char-text">${data.fNameArr[0]}</td><td class="num-text">${data.ren}</td><td class="wx-text">${getWX(data.ren)}</td><td class="ge-label">人格 <span class="qi-text">${renQi}</span></td></tr>`;
            
            html += `<tr class="arrow-row">
                        <td style="position:relative;">
                            <span title="遷移宮" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:14px; color:#999; font-weight:bold;">${qianYi}</span>
                        </td>
                        <td></td><td></td><td>${createArrowSvg(getRelationInfo(data.ren, data.di))}</td><td></td>
                     </tr>`;
            
            if (data.fStrokes.length > 1) {
                html += `<tr class="char-row"><td class="stroke-text" style="position:relative;">${palaceHtml}${data.fStrokes[1]}</td><td class="char-text">${data.fNameArr[1]}</td><td class="num-text">${data.di}</td><td class="wx-text">${getWX(data.di)}</td><td class="ge-label">地格 <span class="qi-text">${diQi}</span></td></tr>`;
            } else {
                html += `<tr class="char-row"><td class="stroke-text" style="position:relative;">${palaceHtml}1</td><td></td><td class="num-text">${data.di}</td><td class="wx-text">${getWX(data.di)}</td><td class="ge-label">地格 <span class="qi-text">${diQi}</span></td></tr>`;
            }
            return html;
        }

        // ================= MBTI 核心設定與渲染函數 =================
        const mbtiScoresMap = {
            "旺象": { i: 80, r: 35, s: 40, c: 30 },
            "淡象": { i: 30, r: 75, s: 70, c: 70 },
            "平雙": { i: 40, r: 60, s: 50, c: 50 },
            "陰陽雙": { i: 70, r: 40, s: 40, c: 40 },
            "金剋木": { i: 90, r: 45, s: 60, c: 60 },
            "木剋土": { i: 50, r: 50, s: 60, c: 70 },
            "土剋水": { i: 60, r: 55, s: 30, c: 60 },
            "水剋火": { i: 90, r: 25, s: 60, c: 60 },
            "火剋金": { i: 60, r: 35, s: 50, c: 60 }
        };

        function buildMBTIHtml(patternName) {
            const scores = mbtiScoresMap[patternName];
            if (!scores) return "";

            return `
                <div class="mbti-container">
                    <h4 style="color:#583385; border-bottom: 1px dashed #e2d9f3; padding-bottom: 8px; margin: 10px 0;">📊 婚姻宮專屬感情特質</h4>
                    
                    <!-- 維度 1：情感表達 -->
                    <div class="mbti-card">
                        <div class="mbti-top">
                            <div class="mbti-side"><span class="mbti-label">主動</span><span class="mbti-letter">I</span><span class="mbti-desc">情感熾熱<br>主動追求</span></div>
                            <div class="mbti-center"><div class="mbti-axis">⬅ 互動拉扯 ➡</div><div class="mbti-axis-desc">有些人主動出擊，<br>有些人隨緣等待。</div></div>
                            <div class="mbti-side"><span class="mbti-label">被動</span><span class="mbti-letter">P</span><span class="mbti-desc">含蓄內斂<br>等待牽引</span></div>
                        </div>
                        <div class="mbti-prog-sec">
                            <div class="mbti-percents"><span>I 主動 ${scores.i}%</span><span>${100 - scores.i}% P 被動</span></div>
                            <div class="mbti-bar-bg"><div class="mbti-bar-fill" style="width: ${scores.i}%;"></div></div>
                        </div>
                    </div>

                    <!-- 維度 2：擇偶取向 -->
                    <div class="mbti-card">
                        <div class="mbti-top">
                            <div class="mbti-side"><span class="mbti-label">理性</span><span class="mbti-letter">R</span><span class="mbti-desc">看重條件<br>現實基礎</span></div>
                            <div class="mbti-center"><div class="mbti-axis">⬅ 擇偶標準 ➡</div><div class="mbti-axis-desc">有些人看重務實條件，<br>有些人渴望靈魂共鳴。</div></div>
                            <div class="mbti-side"><span class="mbti-label">感性</span><span class="mbti-letter">M</span><span class="mbti-desc">注重契合<br>心靈感覺</span></div>
                        </div>
                        <div class="mbti-prog-sec">
                            <div class="mbti-percents"><span>R 理性 ${scores.r}%</span><span>${100 - scores.r}% M 感性</span></div>
                            <div class="mbti-bar-bg"><div class="mbti-bar-fill" style="width: ${scores.r}%;"></div></div>
                        </div>
                    </div>

                    <!-- 維度 3：婚姻氣場 -->
                    <div class="mbti-card">
                        <div class="mbti-top">
                            <div class="mbti-side"><span class="mbti-label">穩定</span><span class="mbti-letter">S</span><span class="mbti-desc">平穩順遂<br>波折較少</span></div>
                            <div class="mbti-center"><div class="mbti-axis">⬅ 緣分顯化 ➡</div><div class="mbti-axis-desc">有些人感情一路順遂，<br>有些人需等待黃金時機。</div></div>
                            <div class="mbti-side"><span class="mbti-label">顯化</span><span class="mbti-letter">F</span><span class="mbti-desc">特定流年<br>引爆正緣</span></div>
                        </div>
                        <div class="mbti-prog-sec">
                            <div class="mbti-percents"><span>S 穩定 ${scores.s}%</span><span>${100 - scores.s}% F 顯化</span></div>
                            <div class="mbti-bar-bg"><div class="mbti-bar-fill" style="width: ${scores.s}%;"></div></div>
                        </div>
                    </div>

                    <!-- 維度 4：相處模式 -->
                    <div class="mbti-card">
                        <div class="mbti-top">
                            <div class="mbti-side"><span class="mbti-label">互補</span><span class="mbti-letter">C</span><span class="mbti-desc">性格互補<br>動靜結合</span></div>
                            <div class="mbti-center"><div class="mbti-axis">⬅ 伴侶型態 ➡</div><div class="mbti-axis-desc">有些人適合性格互補，<br>有些人適合志同道合。</div></div>
                            <div class="mbti-side"><span class="mbti-label">相近</span><span class="mbti-letter">H</span><span class="mbti-desc">觀念相似<br>價值一致</span></div>
                        </div>
                        <div class="mbti-prog-sec">
                            <div class="mbti-percents"><span>C 互補 ${scores.c}%</span><span>${100 - scores.c}% H 相近</span></div>
                            <div class="mbti-bar-bg"><div class="mbti-bar-fill" style="width: ${scores.c}%;"></div></div>
                        </div>
                    </div>
                </div>
            `;
        }
        // ========================================================

        function analyzeName() {
            const lNameInput = document.getElementById('lName').value.trim();
            const fNameInput = document.getElementById('fName').value.trim();
            const YY = parseInt(document.getElementById('yearCurrent').value);
            const XX = parseInt(document.getElementById('birthYear').value);
            const M = parseInt(document.getElementById('birthMonth').value);
            
            if (!lNameInput || !fNameInput) { alert("請先輸入完整的姓名！"); return; }
            if (!YY || !XX || !M) { alert("請完整填寫流年參數（計算年、出生年、出生月）！"); return; }
            
            const data = getGirdData(lNameInput, fNameInput);
            const renD = reduceToSingleDigit(data.ren);
            const diD = reduceToSingleDigit(data.di);
            const renWx = getWX(renD);
            const diWx = getWX(diD);
            const marriageRel = getRelationInfo(renD, diD);

            const age = (YY - XX) + 1;
            let m_calc = M - 6;
            let startYear = m_calc <= 0 ? YY - 1 : YY;
            let endYear = m_calc <= 0 ? YY : YY + 1;
            let displayMonth = m_calc <= 0 ? m_calc + 12 : m_calc;

            const cycle = ["冠帶", "臨官", "帝旺", "衰", "病", "死", "絕", "胎", "養", "長生"];
            const steps = (age % 10 - data.zong % 10 + 10) % 10;
            const fortuneResult = cycle[steps % 10];
            const zongQi = getQi(data.zong, YY); 

            document.getElementById('fortuneDisplay').innerHTML = `
                <div class="age-line-container">
                    <span class="date-text">民國 ${startYear}年 ${displayMonth}月</span>
                    <div class="line-wrapper"><span class="age-text">${age} 歲</span></div>
                    <span class="date-text">民國 ${endYear}年 ${displayMonth}月</span>
                </div>
            `;

            document.getElementById('mResultTable').innerHTML = buildTableHtml(data, renWx, diWx, marriageRel, YY);
            document.getElementById('mTotalBox').innerHTML = `總格 ： ${data.zong} &nbsp; <span style="font-size:22px; color:#2196F3;">${fortuneResult}/${zongQi}</span>`;
            document.getElementById('mResultFrame').style.display = "block";
            
            let analysisHtml = "";
            let patternNameForMBTI = ""; // 紀錄這次要取哪個 MBTI 數據

            if (marriageRel.type === "剋") {
                let detailText = "";
                let title = "";
                
                if ((renWx === "金" && diWx === "木") || (renWx === "木" && diWx === "金")) {
                    title = "金剋木"; patternNameForMBTI = "金剋木";
                    detailText = `<ul style="margin: 0; padding-left: 20px; margin-bottom: 15px; color:#333;"><li>你的緣分往往來自工作上或事業夥伴...</li><li>或與另一半年紀相差大於5歲以上也很適合...</li></ul>`;
                } else if ((renWx === "木" && diWx === "土") || (renWx === "土" && diWx === "木")) {
                    title = "木剋土"; patternNameForMBTI = "木剋土";
                    detailText = `<ul style="margin: 0; padding-left: 20px; margin-bottom: 15px; color:#333;"><li>你的緣分往往來自於人情...</li><li>若已經有不錯的對象想踏入婚姻，較容易發生婚期拖延...</li></ul>`;
                } else if ((renWx === "土" && diWx === "水") || (renWx === "水" && diWx === "土")) {
                    title = "土剋水"; patternNameForMBTI = "土剋水";
                    detailText = `<ul style="margin: 0; padding-left: 20px; margin-bottom: 15px; color:#333;"><li>你的緣分往往來自於「才」或「財」...</li><li>容易因為身邊對象太多導致難以選擇...</li></ul>`;
                } else if ((renWx === "水" && diWx === "火") || (renWx === "火" && diWx === "水")) {
                    title = "水剋火"; patternNameForMBTI = "水剋火";
                    detailText = `<ul style="margin: 0; padding-left: 20px; margin-bottom: 15px; color:#333;"><li>你的緣分往往來自於瞬間接觸的火花...</li><li>但也因為容易找得太急而找錯人...</li></ul>`;
                } else if ((renWx === "火" && diWx === "金") || (renWx === "金" && diWx === "火")) {
                    title = "火剋金"; patternNameForMBTI = "火剋金";
                    detailText = `<ul style="margin: 0; padding-left: 20px; margin-bottom: 15px; color:#333;"><li>你的緣分往往來自於最後認識的那個人。</li></ul>`;
                }
                
                analysisHtml = `
                    <div class="warning-box"><div class="warning-title">⚠️ 婚姻宮帶「破象」</div><div style="font-weight: normal;">若以姓名學專用的術語來看，您的婚姻宮為「剋宮」...</div></div>
                    <div class="analysis-text" style="background: #FAFAFA; padding: 15px; border-radius: 8px; border-left: 4px solid #483D8B;">
                        <div style="color:#483D8B; font-size:16px; margin-bottom:12px;">📌 <strong>從婚姻宮進一步解析（${title}）：</strong></div>
                        ${detailText}
                    </div>
                `;
            } else if (marriageRel.type === "無") {
                if (renD === diD) {
                    patternNameForMBTI = "平雙";
                    analysisHtml = `<div class="analysis-text"><div style="color:#483D8B; font-size:16px; margin-bottom:10px;">📌 <strong>命盤格局：平雙</strong></div>從婚姻宮可以看出，您的格局為「平雙」...</div>`;
                } else {
                    patternNameForMBTI = "陰陽雙";
                    analysisHtml = `<div class="analysis-text"><div style="color:#483D8B; font-size:16px; margin-bottom:10px;">📌 <strong>命盤格局：陰陽雙</strong></div>從婚姻宮可以看出，您的格局為「陰陽雙」...</div>`;
                }
            } else if (marriageRel.type === "生") {
                if (marriageRel.dir === "下") {
                    patternNameForMBTI = "旺象";
                    analysisHtml = `<div class="analysis-text"><div style="color:#483D8B; font-size:16px; margin-bottom:10px;">📌 <strong>命盤格局：旺象 (人格生地格)</strong></div>從婚姻宮可以看出，您的格局為「旺象」...</div>`;
                } else if (marriageRel.dir === "上") {
                    patternNameForMBTI = "淡象";
                    analysisHtml = `<div class="analysis-text"><div style="color:#483D8B; font-size:16px; margin-bottom:10px;">📌 <strong>命盤格局：淡象 (地格生人格)</strong></div>從婚姻宮可以看出，您的格局為「淡象」...</div>`;
                }
            }

            // --- 在原有的分析文字後面，直接串接產生的 MBTI HTML ---
            analysisHtml += buildMBTIHtml(patternNameForMBTI);
            
            document.getElementById('analysisContent').innerHTML = analysisHtml;
            document.getElementById('analysisBox').style.display = "block";
            document.getElementById('downloadContainer').style.display = "block";
        }
        
        function downloadPDF() {
            const btn = document.getElementById('btnDownload');
            const captureElement = document.getElementById('captureArea');
            const pdfTitle = document.getElementById('pdfTitle');
            
            btn.innerText = "⏳ PDF 產生中...";
            btn.disabled = true;
            
            const originalScrollY = window.scrollY;
            const originalScrollX = window.scrollX;
            
            window.scrollTo(0, 0);
            document.body.style.overflow = 'hidden';
            pdfTitle.style.display = 'block';

            const fullName = document.getElementById('lName').value.trim() + document.getElementById('fName').value.trim();
            const fileName = fullName ? `${fullName}_婚姻與流年分析.pdf` : '姓名婚姻與流年分析.pdf';

            const elementHeightPx = captureElement.scrollHeight;
            const elementHeightMm = elementHeightPx * 0.264583; 
            const finalPdfHeight = Math.max(297, elementHeightMm + 20);

            const opt = {
                margin:       10,
                filename:     fileName,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, backgroundColor: '#ffffff', scrollY: 0, windowY: 0 },
                jsPDF:        { unit: 'mm', format: [210, finalPdfHeight], orientation: 'portrait' }
            };

            setTimeout(() => {
                html2pdf().set(opt).from(captureElement).save().then(() => {
                    pdfTitle.style.display = 'none';
                    btn.innerText = "📥 下載分析結果 (PDF)";
                    btn.disabled = false;
                    document.body.style.overflow = '';
                    window.scrollTo(originalScrollX, originalScrollY);
                });
            }, 300);
        }
    </script>
